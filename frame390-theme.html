<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>390 테마 검증용 틀 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#dfe5ee}
  .row{margin:10px 0 26px 10px}
  .cap{font:12px/1.4 sans-serif;color:#333;margin-bottom:4px}
  iframe{border:0;display:block;width:390px;height:844px;background:#fff}
</style>
</head>
<body>
  <div class="row"><div class="cap">A dashboard #/</div><iframe id="f-dash" title="dash" data-src="./index.html" data-hash="#/"></iframe></div>
  <div class="row"><div class="cap">B lines #/lines</div><iframe id="f-lines" title="lines" data-src="./index.html" data-hash="#/lines"></iframe></div>
  <div class="row"><div class="cap">C issues #/issues</div><iframe id="f-issues" title="issues" data-src="./index.html" data-hash="#/issues"></iframe></div>
  <div class="row"><div class="cap">D demo ?demo=1</div><iframe id="f-demo" title="demo" data-src="./index.html?demo=1" data-hash="#/"></iframe></div>
<script>
  /* 임시 검증용: 매번 새로 받도록 캐시 회피 쿼리를 붙인다 (게시판 코드 아님) */
  var cb = '&cb=' + Date.now();
  document.querySelectorAll('iframe[data-src]').forEach(function (f) {
    var src = f.getAttribute('data-src');
    f.src = src + (src.indexOf('?') >= 0 ? cb : '?' + cb.slice(1)) + (f.getAttribute('data-hash') || '');
  });
</script>
</body>
</html>
