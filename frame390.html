<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390 검증용 틀</title>
<style>
  html,body{margin:0;padding:0;background:#dfe5ee}
  .row{margin:10px 0 26px 10px}
  .cap{font:12px/1.4 sans-serif;color:#333;margin-bottom:4px}
  iframe{border:0;display:block;width:390px;height:844px;background:#fff}
</style>
</head>
<body>
  <div class="row"><div class="cap">A lines #/lines</div><iframe id="f-lines" title="lines" src="./index.html#/lines"></iframe></div>
  <div class="row"><div class="cap">B lines form</div><iframe id="f-lineform" title="line form" src="./index.html#/lines"></iframe></div>
  <div class="row"><div class="cap">C issues #/issues</div><iframe id="f-issues" title="issues" src="./index.html#/issues"></iframe></div>
  <div class="row"><div class="cap">D issues form</div><iframe id="f-issueform" title="issue form" src="./index.html#/issues"></iframe></div>
  <div class="row"><div class="cap">E demo lines ?demo=1</div><iframe id="f-demo" title="demo" src="./index.html?demo=1#/lines"></iframe></div>
<script>
  // 임시 검증용: 폼 모달을 자동으로 띄운다 (게시판 코드 아님)
  function autoOpen(frameId, btnSel) {
    var f = document.getElementById(frameId);
    if (!f) return;
    f.addEventListener('load', function () {
      setTimeout(function () {
        try {
          var d = f.contentDocument;
          var b = d && d.querySelector(btnSel);
          if (b) b.click();
        } catch (e) {}
      }, 900);
    });
  }
  autoOpen('f-lineform', '#btn-line-new');
  autoOpen('f-issueform', '#btn-issue-new');
</script>
</body>
</html>
