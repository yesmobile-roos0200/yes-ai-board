<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 검증용 미리보기 (임시)</title>
<style>
  body{margin:0;background:#2b3040;color:#fff;font-family:system-ui,sans-serif;padding:14px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
  .phone{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35);flex:none}
  iframe{display:block;border:0;width:390px;height:844px;background:#fff}
  iframe.narrow{width:360px}
  .lbl{font-size:13px;color:#c9cfdd;margin:0 0 4px 4px}
  .note{font-size:12px;color:#c9cfdd}
</style>
</head>
<body>
  <p class="note">임시 검증 페이지 — 390×844(360×844) 폭에서 탭 잘림·영역별 가로 잘림·목록/본문 가독성 확인용. 확인 후 삭제.</p>
  <div>
    <p class="lbl">① 대시보드 (#/) · 390</p>
    <div class="phone"><iframe id="f-dash" src="./#/" title="390px 대시보드"></iframe></div>
  </div>
  <div>
    <p class="lbl">② 전체 글 (#/list) · 390</p>
    <div class="phone"><iframe id="f-list" src="./#/list" title="390px 전체 글"></iframe></div>
  </div>
  <div>
    <p class="lbl">③ 결산·자료실 (#/archive) · 390</p>
    <div class="phone"><iframe id="f-arch" src="./#/archive" title="390px 결산·자료실"></iframe></div>
  </div>
  <div>
    <p class="lbl">④ 말머리 목록 (#/c/업무) · 360</p>
    <div class="phone"><iframe id="f-narrow" class="narrow" src="./#/c/%EC%97%85%EB%AC%B4" title="360px 말머리 목록"></iframe></div>
  </div>
  <div>
    <p class="lbl">⑤ 글 본문·댓글 (#/p/23) · 390</p>
    <div class="phone"><iframe id="f-detail" src="./#/p/23" title="390px 글 본문"></iframe></div>
  </div>
</body>
</html>
